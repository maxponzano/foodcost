<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menù Lab · Food cost e menu engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a6d'/%3E%3Cpath d='M14 41a18 18 0 0 1 36 0' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3Crect x='9' y='44' width='46' height='5.5' rx='2.75' fill='%23fff'/%3E%3Cpath d='M32 12.5l6 9.5h-12z' fill='%23e0237f' stroke='%23e0237f' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--q1:#18764a;--q2:#d98b16;--q3:#3c6ebe;--q4:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--brand:#1e3a6d;--brand-ink:#ffffff;--brand-soft:#b6c7ea;--bar:#1e3a6d;
--bg:#f3f5f9;--card:#ffffff;--ink:#1c2433;--mut:#5d6778;--line:#dde3ec;--acc:#c8176f;--acc-ink:#fff;--ok:#2f6b4f;--warn:#b7791f;--bad:#b3261e;--chip:#eaeef5;
--f-head:"Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--q1:#257d4f;--q2:#b8843a;--q3:#6090dc;--q4:#de625b;--brand:#1e3a6d;--brand-soft:#b6c7ea;--bar:#8fa9dc;--bg:#161d2b;--card:#1d2638;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2e3a52;--acc:#f06aa8;--acc-ink:#1a1020;--ok:#5fb28a;--warn:#e0b050;--bad:#f2857d;--chip:#26314a}}
:root[data-theme="dark"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--q1:#257d4f;--q2:#b8843a;--q3:#6090dc;--q4:#de625b;--brand:#1e3a6d;--brand-soft:#b6c7ea;--bar:#8fa9dc;--bg:#161d2b;--card:#1d2638;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2e3a52;--acc:#f06aa8;--acc-ink:#1a1020;--ok:#5fb28a;--warn:#e0b050;--bad:#f2857d;--chip:#26314a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;min-height:100%;padding-bottom:84px}
h1,h2{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:-.01em}
header{background:var(--brand);color:var(--brand-ink);padding:14px max(16px,calc((100% - 1200px)/2)) 12px;border-bottom:3px solid var(--acc)}
header h1{font-size:22px;font-weight:800;letter-spacing:.01em}
header h1 span{color:var(--brand-soft);font-weight:600}
header h1.brand{display:flex;align-items:center;gap:8px}
header h1 .bt{color:#fff}
header h1 .bt span{color:var(--brand-soft)}
header h1 .logo{width:30px;height:30px;color:#fff;flex:0 0 30px}
header h1 small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--brand-soft);letter-spacing:.06em;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.3);padding-left:8px;margin-left:2px}
.authbrand{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 16px;text-align:center}
.authbrand svg{width:64px;height:64px;color:var(--brand)}
.authbrand b{font-family:var(--f-head);font-size:24px;font-weight:800;color:var(--brand)}
.authbrand b span{color:var(--acc)}
.authbrand em{font-style:normal;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .authbrand svg,:root:not([data-theme="light"]) .authbrand b{color:var(--brand-soft)}}
:root[data-theme="dark"] .authbrand svg,:root[data-theme="dark"] .authbrand b{color:var(--brand-soft)}
header p{margin:2px 0 0;color:var(--brand-soft);font-size:13px}
main{max-width:760px;margin:0 auto;padding:8px 16px 24px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:120px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:10px}
label>input,label>select{margin-top:4px;color:var(--ink);font-size:15px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--chip);cursor:pointer;min-height:42px}
button.pri{background:var(--acc);color:var(--acc-ink);font-weight:600}
button.del{color:var(--bad)}
button.pri.danger{background:var(--bad);color:#fff}
button.sm{min-height:34px;padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:10px;cursor:pointer;align-items:center}
.item b{display:block}
.mut{color:var(--mut);font-size:13px}
.right{text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mut)}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:36px 12px;border:1px dashed var(--line);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{display:flex;width:100%;max-width:760px;overflow-x:auto;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav button{flex:1;background:none;border-radius:0;padding:12px 4px;font-size:13px;color:var(--mut);min-height:54px}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:20px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .pri{flex:1}
.hist{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{background:var(--chip);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;color:var(--ink);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{background:var(--chip);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip button{min-height:22px;padding:0 6px;background:none;color:var(--mut);font-size:16px;line-height:1}
.ing{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card)}
.ing .top{display:flex;gap:8px}
.ing .top input{flex:1}
.ing .grid3{margin-top:8px;grid-template-columns:1fr 1fr 1fr}
.cost{font-weight:700;text-align:right;padding-bottom:10px}
.tot{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:12px 14px;margin:14px 0}
.tot .r{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:20px;font-weight:700}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.soon{font-size:13px;color:var(--mut);margin-top:16px}

nav button{font-size:12px;flex:0 0 auto;padding:12px 11px;white-space:nowrap}
.gh{font-size:14px;margin:22px 0 8px;color:var(--brand);letter-spacing:.06em;text-transform:uppercase;border-left:4px solid var(--acc);padding-left:8px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kgrid label{margin:0}
.kv{background:var(--chip);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mut)}
.kv b{display:block;font-size:14px;color:var(--ink)}
.kv b.ok{color:var(--ok)}.kv b.warn{color:var(--warn)}.kv b.bad{color:var(--bad)}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-of-type{border-bottom:0}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.avg{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--chip);font-size:13px}
.b-ok{background:rgba(47,107,79,.18);color:var(--ok)}.b-warn{background:rgba(183,121,31,.18);color:var(--warn)}
.b-info{background:rgba(60,110,190,.18);color:#4a7fd0}.b-bad{background:rgba(179,38,30,.15);color:var(--bad)}.b-mut{background:var(--chip);color:var(--mut)}
.badge{font-weight:600}
details.lg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px}
details.lg summary{cursor:pointer;font-weight:600}
details.lg p{margin:6px 0 0}
/* multi-cliente */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#top select{width:auto;max-width:260px;min-height:34px;padding:4px 8px;font-size:13px;background:#fff;color:#1c2433;border-color:transparent}
#top button{background:rgba(255,255,255,.14);color:#fff}
#top button:hover{background:rgba(255,255,255,.24)}
.role{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--acc);color:#fff;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
body:not(.authed) nav{display:none}
.auth{max-width:420px;margin:24px auto 0}
.auth h2{font-size:20px;margin-bottom:12px}
.link{background:none;padding:6px 0;color:var(--acc);min-height:0;text-decoration:underline}
.info{background:rgba(47,107,79,.12);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.counter{font-size:13px;color:var(--mut);margin:-4px 0 10px}
.counter b{color:var(--ink)}.counter.full b{color:var(--bad)}
button.locked{opacity:.5}
.lockmsg{background:rgba(179,38,30,.1);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.lockmsg:empty{display:none}
input:disabled,select:disabled,textarea:disabled{opacity:1;color:var(--ink);background:var(--chip);-webkit-text-fill-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;display:none}
.adm .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adm .row>*{flex:1;min-width:130px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:6px 0}
.chk input{width:auto;min-height:0}
.tmp{background:rgba(183,121,31,.14);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tmp code{font-size:17px;font-weight:700;letter-spacing:.05em;user-select:all}
details.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
details.tc summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details.tc summary::-webkit-details-marker{display:none}
.sm-list{font-size:13px;color:var(--mut);margin:6px 0}
/* grafico a quadranti del menu engineering */
.qchart{position:relative;margin:2px 0 14px}
.qchart svg{display:block;max-width:100%;height:auto;overflow:visible;font-family:var(--f-body)}
.qchart .qbg{opacity:.07}
.qchart .grid{stroke:var(--line);stroke-width:1}
.qchart .ax{stroke:var(--mut);stroke-width:1;opacity:.6}
.qchart .avgl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.qchart text{fill:var(--mut);font-size:11px}
.qchart .tk{font-size:11px;font-feature-settings:"tnum" 1}
.qchart .at{font-size:11px;font-weight:500}
.qchart .avt{font-size:11px;font-weight:600;fill:var(--ink);stroke:var(--card);stroke-width:3px;stroke-linejoin:round;paint-order:stroke}
.qchart .ql{font-size:10.5px;font-weight:700;letter-spacing:.06em}
.qchart .dot{stroke:var(--card);stroke-width:2}
.qchart .qhit{fill:transparent;cursor:pointer}
.qchart .dot.on{stroke:var(--ink);stroke-width:2.5}
.qchart .dot.ex{fill-opacity:.35;stroke-dasharray:2 2;stroke:var(--mut)}
.qwrap{display:flex;flex-direction:column;gap:10px}
.qwrap.side{flex-direction:row;align-items:flex-start;gap:16px}
.qplot{min-width:0}
.qbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:12px;flex:0 0 auto}
.qwrap.side .qbox{width:190px;margin-top:22px}
.qbt{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
.qli{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.qli i{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:3px}
.qli span{display:block;font-weight:600;color:var(--ink)}
.qli em{font-style:normal;color:var(--mut);font-weight:600;margin-left:2px}
.qli small{display:block;color:var(--mut);font-size:11px;line-height:1.3}
.qbn{margin:6px 0 0;color:var(--mut);font-size:11px;line-height:1.35}
.qtip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;z-index:3;transform:translate(-50%,calc(-100% - 10px))}
.qleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:4px}
.qleg span{display:inline-flex;align-items:center;gap:5px}
.qleg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.qnote{font-size:12px;color:var(--mut);padding:6px 0 10px}
.thead{display:none}
.avgchk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);margin:3px 0 0;cursor:pointer}
.avgchk input{width:auto;min-height:0;margin:0}
.mrow.noavg .mname b,.mrow.noavg .kv b{opacity:.5}
/* grafici */
.ch{font-family:var(--f-head);font-size:14px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.cnote{font-size:12px;margin:8px 0 0}
.hb{display:flex;flex-direction:column;gap:6px}
.hb.hb-has-tgt{padding-top:16px}
.hb-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb-t{position:relative;height:12px}
.hb-b{height:12px;border-radius:0 4px 4px 0;min-width:2px}
.hb-b.dim{opacity:.35}
.hb-v{font-weight:600;min-width:62px;white-space:nowrap;text-align:right;color:var(--ink)}
.hb-tgt{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--mut);z-index:1}
.hb-row:first-child .hb-tgt span{position:absolute;top:-17px;left:-30px;font-size:10px;color:var(--mut);white-space:nowrap}
.hb-row:not(:first-child) .hb-tgt span{display:none}
#ctip{position:fixed;display:none;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;z-index:30;max-width:280px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi b{font-family:var(--f-head);font-size:26px;font-weight:700;color:var(--ink)}
.kpi b small{font-size:14px;color:var(--mut);font-weight:600}
.kpi b.ok{color:var(--ok)}.kpi b.warn{color:var(--warn)}.kpi b.bad{color:var(--bad)}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.fcchart{margin:0 0 12px}
.stack{display:flex;gap:2px;height:16px;border-radius:4px;overflow:hidden;margin:4px 0 10px}
.stack span{display:block;height:100%}
.leg div{display:grid;grid-template-columns:12px 1fr auto 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.leg i{width:10px;height:10px;border-radius:50%}
.leg b{font-weight:600}.leg em{font-style:normal;color:var(--mut);text-align:right}
#t-comp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
#t-comp:empty{display:none}
.pchart{margin:10px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pchart svg{display:block;max-width:100%;height:auto;margin-top:8px;font-family:var(--f-body)}
.pchart text{fill:var(--mut);font-size:11px;font-feature-settings:"tnum" 1}
.pchart .ax{stroke:var(--line)}.pchart .avgl{stroke:var(--mut);stroke-dasharray:4 4}
.pchart .pl{fill:none;stroke:var(--brand);stroke-width:2}
.pchart .pdot{fill:var(--brand);stroke:var(--card);stroke-width:2;r:5}
.pchart .qhit{fill:transparent;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pchart .pl{stroke:var(--brand-soft)}:root:not([data-theme="light"]) .pchart .pdot{fill:var(--brand-soft)}}
:root[data-theme="dark"] .pchart .pl{stroke:var(--brand-soft)}:root[data-theme="dark"] .pchart .pdot{fill:var(--brand-soft)}
.sim .simk{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 4px}
.sim .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:6px}
.sim label{color:var(--mut)}
.simt{width:100%;border-collapse:collapse;font-size:14px}
.simt th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:4px 6px;font-weight:600}
.simt td{padding:6px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.simt td:first-child,.simt th:first-child{text-align:left;font-weight:500}
.csel{width:auto;min-height:34px;padding:4px 8px;font-size:13px;max-width:60%}
.perbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.perbar select,.perbar input{width:auto;min-height:34px;padding:4px 8px;font-size:13px}
.perbar label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px}
.perbar .sm{margin-left:auto}
.sbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sbar input{width:auto;min-height:38px;padding:6px 10px}
.sbar .smt{font-family:var(--f-head);font-size:18px;text-transform:capitalize;margin-left:6px}
.kpis3{grid-template-columns:repeat(3,1fr)}
.sbar .smt.wk{text-transform:none}.sbar label{display:inline;margin:0;font-size:13px}.sbar .swn{width:64px}.sbar .swy{width:84px}.sbar .csel{margin-right:6px}.sbar .sres{margin-left:auto}
.wkinfo{margin:-4px 0 12px;font-size:13px}
.rad{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;cursor:pointer;font-size:14px}
.rad input{width:auto;min-height:0;margin-top:3px}

.trw .td{font-size:11px;font-weight:600;fill:var(--mut)}.trw .td.up{fill:var(--ok)}.trw .td.dn{fill:var(--bad)}
.trw .qhit{fill:transparent;cursor:pointer}
.grid-2{display:grid;grid-template-columns:1fr;gap:0;margin-bottom:12px}
.gh .cnt{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:0;margin-left:4px}
.rgh:first-child{margin-top:4px}
.rlink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

  /* editor ricetta su due colonne */

<body>
<header><div class="topbar"><h1 class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 31a14 14 0 0 1 28 0" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/><rect x="6" y="33.5" width="36" height="4.2" rx="2.1" fill="currentColor"/><path d="M24 9.5l4.6 7.3h-9.2z" fill="var(--acc)" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="bt">Menù <span>Lab</span></span><small>by EDAC</small></h1><div id="top"></div></div><p id="sub"></p></header>
<nav><div class="in">
  <button data-tab="riepilogo">Riepilogo</button>
  <button data-tab="alimenti">Alimenti</button>
  <button data-tab="ricette">Ricette</button>
  <button data-tab="marginalita">Marginalità</button>
  <button data-tab="vendite">Vendite</button>
  <button data-tab="menu">Menù Ingegnerizzato</button>
  <button data-tab="dati">Dati</button>
  <button data-tab="clienti" id="nav-clienti" hidden>Clienti</button>
</div></nav>
<main id="app"></main>
<div id="sheet"></div>
<div id="toast"></div>


<script>
/* ---------- stato: i dati arrivano dal server (nessun salvataggio nel browser) ---------- */
var ME=null;      // utente collegato e attività a cui ha accesso (/api/me)
var CUR=null;     // id dell'attività su cui si sta lavorando
var S=null;       // dati dell'attività corrente (/api/data)
var RO=true;      // sola lettura
var ADM=null;     // dati del pannello clienti (solo super admin)
var route={tab:'riepilogo',q:'',cat:'',food:null,recipe:null,auth:'login',pw:null};
var LIMIT_BASIC='Hai raggiunto il limite del piano base. Contatta l\'amministratore per ampliarlo.';
var LIMIT_OTHER='Hai raggiunto il limite di ricette del tuo piano. Contatta l\'amministratore per ampliarlo.';

function isSuper(){return !!(ME&&ME.user.role==='super_admin')}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}

/* tutte le chiamate al server; le rotte dei dati portano l'attività scelta, che il server verifica */
function api(method,path,body){
  var url='/api'+path;
  if(CUR&&/^\/(data|tenant|lists|foods|recipes|sales)/.test(path))url+=(url.indexOf('?')>=0?'&':'?')+'tenant='+encodeURIComponent(CUR);
  var o={method:method,credentials:'same-origin',headers:{}};
  if(body!==undefined){o.headers['content-type']='application/json';o.body=JSON.stringify(body)}
  return fetch(url,o).then(function(res){
    return res.text().then(function(t){
      var d=null;try{d=t?JSON.parse(t):null}catch(e){}
      if(res.ok)return d;
      var err={status:res.status,code:d&&d.error,message:(d&&d.message)||'Errore di rete. Riprova.'};
      if(res.status===401&&path!=='/login'&&path!=='/me'){ME=null;S=null;route.auth='login';route.authMsg=err.message;render()}
      throw err;
    });
  },function(){throw{status:0,message:'Connessione assente. Riprova.'}});
}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3500)}
function showErr(e){toast((e&&e.message)||'Errore')}
var timers={};
function later(key,fn,ms){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms||500)}

function loadData(){
  if(!CUR){S=null;RO=true;return Promise.resolve()}
  return api('GET','/data').then(function(d){S=d;RO=!d.canWrite;applySales()})
    .catch(function(e){if(e.status===403||e.status===404){CUR=null;lsSet('fc:tenant',null);S=null;return}throw e});
}
function boot(){
  return api('GET','/me').then(function(m){
    ME=m;
    var ids=m.tenants.map(function(t){return t.id}),saved=lsGet('fc:tenant');
    if(CUR&&ids.indexOf(CUR)<0)CUR=null;
    if(!CUR)CUR=ids.indexOf(saved)>=0?saved:(!isSuper()&&m.tenants.length?m.tenants[0].id:null);
    if(isSuper()&&!CUR)route.tab='clienti';
    if(m.user.mustChangePw)route.pw={forced:true};
    return loadData();
  }).then(render).catch(function(e){ME=null;if(e.status!==401)route.authMsg=e.message;render()});
}
function refreshMe(){return api('GET','/me').then(function(m){ME=m;renderTop()})}
function switchTenant(id){
  route.per=null;route.sm=null;route.sw=null;route.tr=null;route.sreset=null;
  CUR=id||null;lsSet('fc:tenant',CUR);route.food=null;route.recipe=null;route.q='';route.cat='';
  if(CUR&&route.tab==='clienti')route.tab='riepilogo';
  loadData().then(render).catch(showErr);
}
function reload(){return loadData().then(render)}

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function eurp(n){return eur(n,Math.abs(n)<0.1&&n!==0?4:2)}
function eur(n,d){if(n==null||isNaN(n))return '—';return n.toLocaleString('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function today(){return new Date().toISOString().slice(0,10)}
function dIt(s){var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}

/* ---------- calcoli alimenti ---------- */
var MODES={min:'Minimo',avg:'Medio',max:'Massimo',last:'Ultimo'};
function stats(f){
  var h=(f.history||[]).filter(function(x){return x.price>0}).slice().sort(function(a,b){return a.date<b.date?-1:1});
  if(!h.length)return null;
  var p=h.map(function(x){return x.price});
  return{min:Math.min.apply(null,p),max:Math.max.apply(null,p),avg:p.reduce(function(a,b){return a+b},0)/p.length,last:p[p.length-1]};
}
function selPrice(f){var s=stats(f);return s?s[f.mode||'max']:null}
/* restituisce {basis:'mass'|'volume'|'piece', perBase: € per g / ml / pz, label:'€/kg', disp: valore mostrato} */
function unitInfo(f){
  var P=selPrice(f);if(P==null)return null;
  var u=f.unit||'kg';
  if(u==='kg')return{basis:'mass',perBase:P/1000,label:'/kg',disp:P};
  if(u==='lt')return{basis:'volume',perBase:P/1000,label:'/lt',disp:P};
  if(u==='pz')return{basis:'piece',perBase:P,label:'/pz',disp:P};
  var q=num(f.packQty);if(q<=0)return null;
  var pu=f.packUnit||'g',per=P/q;
  if(pu==='g')return{basis:'mass',perBase:per,label:'/kg',disp:per*1000};
  if(pu==='ml')return{basis:'volume',perBase:per,label:'/lt',disp:per*1000};
  return{basis:'piece',perBase:per,label:'/pz',disp:per};
}
var BASEU={mass:'g',volume:'ml',piece:'pz',dose:'dosi'};
function foodByName(n){n=String(n).trim().toLowerCase();return S.foods.filter(function(f){return f.name.trim().toLowerCase()===n})[0]}
function foodById(id){return S.foods.filter(function(f){return f.id===id})[0]}

/* ---------- calcoli ricette ---------- */
function recipeById(id){return S.recipes.filter(function(r){return r.id===id})[0]}
/* una ricetta usata come ingrediente: costo al grammo se ha la resa in grammi, altrimenti costo per dose */
function subInfo(rc,stack){
  var t=recipeTotal(rc,stack);if(!(t.total>0))return null;
  var y=num(rc.yieldG);
  if(y>0)return{basis:'mass',perBase:t.total/y,label:'/kg',disp:t.total/y*1000,sub:true};
  var d=num(rc.portions)>0?num(rc.portions):1;
  return{basis:'dose',perBase:t.total/d,label:'/dose',disp:t.total/d,sub:true};
}
function rowInfo(r,stack){
  stack=stack||[];
  if(r.subId){var sr=recipeById(r.subId);if(!sr||stack.indexOf(sr.id)>=0)return null;return subInfo(sr,stack.concat(sr.id))}
  var f=foodById(r.foodId);return f?unitInfo(f):null;
}
function rowCost(r,stack){
  var ui=rowInfo(r,stack);if(!ui)return null;
  var w=Math.min(Math.max(num(r.waste),0),99.9);
  return num(r.qty)*ui.perBase/(1-w/100);
}
function recipeTotal(rc,stack){stack=stack||[rc.id];var t=0,miss=0;rc.rows.forEach(function(r){if(!r.foodId&&!r.subId&&!r.name)return;var c=rowCost(r,stack);if(c==null)miss++;else t+=c});return{total:t,miss:miss}}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle('authed',!!ME);
  if(!ME){renderAuth();return}
  renderTop();
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===route.tab&&!route.recipe)});
  var nc=document.getElementById('nav-clienti');nc.hidden=!isSuper();
  if(isSuper()){var pend=ME.tenants.filter(function(t){return t.status==='pending'}).length;nc.textContent='Clienti'+(pend?' ('+pend+')':'')}
  subt();
  var app=document.getElementById('app');
  if(route.tab==='clienti'&&isSuper())app.innerHTML=adminHTML();
  else if(!S)app.innerHTML=isSuper()?'<div class="empty">Scegli un cliente dal selettore in alto<br>oppure dalla sezione Clienti.</div>':'<div class="empty">Nessuna attività assegnata al tuo account.<br>Contatta l\'amministratore.</div>';
  else if(route.recipe)app.innerHTML=recipeEditorHTML();
  else if(route.tab==='riepilogo')app.innerHTML=riepHTML();
  else if(route.tab==='vendite')app.innerHTML=venditeHTML();
  else if(route.tab==='alimenti')app.innerHTML=foodsHTML();
  else if(route.tab==='ricette')app.innerHTML=recipesHTML();
  else if(route.tab==='marginalita')app.innerHTML=margHTML();
  else if(route.tab==='menu')app.innerHTML=menuHTML();
  else app.innerHTML=datiHTML();
  document.getElementById('sheet').innerHTML=route.pw?pwSheetHTML():(route.imp&&S?impSheetHTML():route.sreset&&S?sresetSheetHTML():route.bulk&&S?bulkSheetHTML():(route.food&&S?foodSheetHTML():''));
  if(!S||route.tab==='clienti'){}
  else if(route.recipe)recalc();
  else if(route.tab==='marginalita')paintMarg();
  else if(route.tab==='menu')paintMenu();
  else if(route.tab==='vendite')paintSales();
  applyRO();
  if(route.restoreY!=null&&!route.recipe){window.scrollTo(0,route.restoreY);route.restoreY=null}
}
/* sola lettura: nasconde i pulsanti di modifica e blocca i campi (il server rifiuta comunque ogni scrittura) */
var WRITE=['sreset','bulkmode','newfood','savefood','delfood','addprice','delprice','newrecipe','saverecipe','dupl','delrecipe','addrow','delrow','addlist','dellist'];
function applyRO(){
  if(!RO||!S||route.tab==='clienti')return;
  ['app'].concat(route.food&&!route.pw?['sheet']:[]).forEach(function(id){
    var el=document.getElementById(id);
    el.querySelectorAll('[data-act]').forEach(function(b){if(WRITE.indexOf(b.dataset.act)>=0)b.style.display='none'});
    el.querySelectorAll('input,select,textarea').forEach(function(i){if(!i.hasAttribute('data-keep'))i.disabled=true});
  });
}
var ROLES={super_admin:'Super admin',admin:'Amministratore',viewer:'Sola lettura'};
var TSTAT={pending:'in attesa',approved:'attivo',suspended:'sospeso'};
function renderTop(){
  var el=document.getElementById('top');if(!ME){el.innerHTML='';return}
  var h='';
  if(isSuper()||ME.tenants.length>1){
    h+='<select data-keep onchange="switchTenant(this.value)" aria-label="Cliente">'+(isSuper()||!CUR?'<option value="">— scegli cliente —</option>':'')
      +ME.tenants.map(function(t){return'<option value="'+t.id+'"'+(t.id===CUR?' selected':'')+'>'+esc(t.ragione)+(t.status!=='approved'?' ('+TSTAT[t.status]+')':'')+'</option>'}).join('')+'</select>';
  }
  var role=isSuper()?'super_admin':(S?(S.canWrite?'admin':'viewer'):(ME.user.role==='viewer'?'viewer':'admin'));
  h+='<span class="role" title="'+esc(ME.user.email)+'">'+ROLES[role]+'</span>'
   +'<button class="sm" data-act="pwopen">Password</button><button class="sm" data-act="logout">Esci</button>';
  el.innerHTML=h;
}
function lockFood(){if(!S||RO)return'Accesso in sola lettura.';if(S.isSuper||S.tenant.canAddFoods)return'';return'La creazione di alimenti non è abilitata per la tua attività. Contatta l\'amministratore.'}
function lockRecipe(){
  if(!S||RO)return'Accesso in sola lettura.';if(S.isSuper)return'';
  if(!S.tenant.canAddRecipes)return'La creazione di ricette non è abilitata per la tua attività. Contatta l\'amministratore.';
  if(S.tenant.maxRecipes!=null&&S.recipeCount>=S.tenant.maxRecipes)return S.tenant.plan==='basic'?LIMIT_BASIC:LIMIT_OTHER;
  return'';
}
function showLock(m){var e=document.getElementById('lockmsg');if(e){e.textContent=m;e.scrollIntoView({block:'nearest'})}else toast(m)}

/* ---------- ALIMENTI ---------- */
function visibleFoods(){
  var q=route.q.toLowerCase();
  return S.foods.filter(function(f){return(!q||f.name.toLowerCase().indexOf(q)>=0||(f.supplier||'').toLowerCase().indexOf(q)>=0)&&(!route.cat||f.category===route.cat)})
    .sort(function(a,b){return a.name.localeCompare(b.name,'it')});
}
function foodsHTML(){
  var lk=lockFood();
  var h='<div class="bar"><input id="q" data-keep placeholder="Cerca alimento o fornitore" value="'+esc(route.q)+'" oninput="route.q=this.value;keepFocus(\'q\',foodsList)">'
   +'<select data-keep onchange="route.cat=this.value;render()"><option value="">Tutti i reparti</option>'+S.lists.reparti.map(function(c){return'<option'+(route.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>'
   +'<button data-act="bulkmode" title="Cambia il prezzo da usare di tutti gli alimenti in elenco">Prezzo da usare…</button>'
   +'<button class="pri'+(lk?' locked':'')+'" data-act="newfood">+ Alimento</button></div><div id="lockmsg" class="lockmsg"></div><div id="flist">'+foodsList()+'</div>';
  return h;
}
function foodsList(){
  var list=visibleFoods();
  if(!S.foods.length)return'<div class="empty">Nessun alimento.'+(RO?'':'<br>Tocca “+ Alimento” per inserire il primo.')+'</div>';
  if(!list.length)return'<div class="empty">Nessun risultato.</div>';
  return list.map(function(f){
    var ui=unitInfo(f);
    return'<div class="card item" data-act="editfood" data-id="'+f.id+'"><div><b>'+esc(f.name)+'</b><span class="mut">'+esc(f.category||'Senza reparto')+(f.supplier?' · '+esc(f.supplier):'')+'</span></div>'
    +'<div class="right">'+(ui?'<b>'+eurp(ui.disp)+ui.label+'</b><span class="mut">prezzo '+MODES[f.mode||'max'].toLowerCase()+'</span>':'<span class="warn">senza prezzo</span>')+'</div></div>';
  }).join('');
}
/* cambio massivo del prezzo da usare sugli alimenti visibili (filtri e ricerca attivi) */
function bulkPreview(mode){
  var list=visibleFoods(),ids={},changed=list.filter(function(f){return (f.mode||'max')!==mode});
  changed.forEach(function(f){ids[f.id]=1});
  var before=S.recipes.map(function(r){return recipeTotal(r).total});
  var saved=changed.map(function(f){return f.mode});
  changed.forEach(function(f){f.mode=mode});
  var n=0,up=0,down=0;
  S.recipes.forEach(function(r,i){var a=recipeTotal(r).total,d=a-before[i];if(Math.abs(d)>0.0005){n++;if(d>0)up++;else down++}});

function recalc(){
  var r=route.recipe;if(!r)return;

    }
  });
  var t=recipeTotal(r),d=num(r.portions)>0?num(r.portions):1,dose=t.total/d;

  s('t-fc',p>0?(dose/net*100).toFixed(1).replace('.',',')+' %':'—');
  s('t-mg',p>0?eur(net-dose):'—');
  drawComp(r);
}

var SUBS={vendite:'Vendite per mese o per settimana',riepilogo:'Riepilogo del locale',alimenti:'Anagrafica alimenti e prezzi',ricette:'Ricettario e food cost',marginalita:'Food cost e margini per piatto',menu:'Menù Ingegnerizzato',dati:'Anagrafica attività e liste',clienti:'Pannello clienti'};
function subt(){

  var e=document.getElementById('sub');if(e)e.textContent=route.recipe?'Ricetta':(t?t+' — ':'')+SUBS[route.tab];
}
function byName(a,b){return a.name.localeCompare(b.name,'it')}
function groups(){
  var g=[];
  S.lists.tipologie.forEach(function(t){var rs=S.recipes.filter(function(r){return r.type===t});if(rs.length)g.push({t:t,rs:rs.sort(byName)})});
  var o=S.recipes.filter(function(r){return !r.type||S.lists.tipologie.indexOf(r.type)<0});
  if(o.length)g.push({t:'Senza tipologia',rs:o.sort(byName)});
  return g;
}
function calcR(r){
  var t=recipeTotal(r),d=num(r.portions)>0?num(r.portions):1,dose=t.total/d,p=num(r.price),net=p>0?p/(1+S.iva/100):0;
  return{dose:dose,miss:t.miss,p:p,net:net,ok:t.total>0,fcPct:net>0?dose/net:null,mg:net>0?net-dose:null,mgPct:net>0?(net-dose)/net:null};
}
function pct(x){return x==null?'—':(x*100).toFixed(1).replace('.',',')+' %'}
function fcClass(x){if(x==null)return'';var t=S.fcTarget/100;return x<=t?'ok':(x<=t+0.05?'warn':'bad')}
function setT(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
function setInAvg(id,v){var r=recipeById(id);r.inAvg=v;var row=document.getElementById('mr-'+id);if(row)row.classList.toggle('noavg',!v);paintMarg();api('PATCH','/recipes/'+id,{inAvg:v}).catch(showErr)}
function setPrice(id,v){var r=recipeById(id);r.price=v;paintMarg();later('pr'+id,function(){api('PATCH','/recipes/'+id,{price:v}).catch(showErr)})}
function margHTML(){
  if(!S.recipes.length)return'<div class="empty">Nessuna ricetta.<br>Creale nella sezione Ricette.</div>';
  return simHTML()+'<p class="mut" style="margin:0 0 6px">Inserisci il prezzo di vendita IVA inclusa: food cost e margini si calcolano da soli. Il food cost è verde fino al '+S.fcTarget+'%, arancione fino a +5 punti, poi rosso.</p>'
  +groups().map(function(g,gi){
    return'<h2 class="gh">'+esc(g.t)+'</h2><div class="card mt m6"><div class="fcchart" id="fc-'+gi+'"></div><div class="thead"><span>Piatto</span><div><span>Prezzo IVA incl.</span><span>IVA escl.</span><span>Food cost dose</span><span>Food cost %</span><span>Margine €</span><span>Margine %</span></div></div>'+g.rs.map(function(r){
      return'<div class="mrow'+(r.inAvg===false?' noavg':'')+'" id="mr-'+r.id+'"><div class="mname"><div class="mh"><b class="rlink" data-act="openrecipe" data-id="'+r.id+'" title="Apri la ricetta">'+esc(r.name)+'</b><span class="mut warn" id="mw-'+r.id+'"></span></div>'
        +'<label class="avgchk" title="Se togli la spunta, il piatto resta in elenco ma non entra nelle medie della categoria"><input type="checkbox"'+(r.inAvg===false?'':' checked')+' onchange="setInAvg(\''+r.id+'\',this.checked)"> conta nella media</label></div>'
      +'<div class="kgrid"><label><span class="kl">Prezzo IVA incl. €</span><input type="number" inputmode="decimal" step="0.01" value="'+esc(r.price||'')+'" oninput="setPrice(\''+r.id+'\',this.value)"></label>'
      +'<div class="kv"><span class="kl">Prezzo IVA escl.</span><b id="mn-'+r.id+'"></b></div><div class="kv"><span class="kl">Food cost dose</span><b id="mf-'+r.id+'"></b></div>'
      +'<div class="kv"><span class="kl">Food cost %</span><b id="mp-'+r.id+'"></b></div><div class="kv"><span class="kl">Margine €</span><b id="mg-'+r.id+'"></b></div><div class="kv"><span class="kl">Margine %</span><b id="mq-'+r.id+'"></b></div></div></div>';
    }).join('')+'<div class="avg" id="ma-'+gi+'"></div></div>';
  }).join('');
}
function paintMarg(){
  paintSim();
  groups().forEach(function(g,gi){
    drawFc(gi,g);
    var sd=0,sn=0,smg=0,n=0;
    g.rs.forEach(function(r){
      var c=calcR(r);
      setT('mn-'+r.id,c.net>0?eur(c.net):'—');setT('mf-'+r.id,c.ok?eur(c.dose):'—');
      var e=document.getElementById('mp-'+r.id);if(e){e.textContent=c.ok?pct(c.fcPct):'—';e.className=c.ok?fcClass(c.fcPct):''}
      setT('mg-'+r.id,c.mg==null||!c.ok?'—':eur(c.mg));setT('mq-'+r.id,c.ok?pct(c.mgPct):'—');
      setT('mw-'+r.id,c.miss?'⚠ '+c.miss+' ingr. senza prezzo':'');
      if(c.net>0&&c.ok&&r.inAvg!==false){sd+=c.dose;sn+=c.net;smg+=c.mg;n++}
    });
    var ex=g.rs.filter(function(r){return r.inAvg===false}).length;
    setT('ma-'+gi,(n?'Media categoria · Food cost '+pct(sd/sn)+' · Margine '+eur(smg/n)+' · Prezzo medio IVA escl. '+eur(sn/n):'Media categoria: inserisci i prezzi di vendita')+(ex?' · '+ex+' piatt'+(ex===1?'o escluso':'i esclusi')+' dalla media':''));
  });
}

function classify(x,aJ,aG,aK){
  if(!(x.net>0&&x.c.ok))return{t:'Manca prezzo o ingredienti',c:'b-mut',h:''};
  if(!(x.sold>0))return{t:'Inserisci il venduto',c:'b-mut',h:''};
  var P=x.sold<aJ?'-':'+',Q=x.mg<aG?'-':'+',fast=x.tm>0&&x.tm<aK;
  var b={'++':['Fuoriclasse','b-ok','Mantienilo e promuovilo.'],'+-':['Instancabili','b-warn','Molto venduto ma rende poco: ritocca prezzo o food cost.'],'-+':['Diamanti grezzi','b-info','Rende bene ma si vende poco: valorizzalo nel menù.'],'--':['Rami secchi','b-bad','Poco venduto e poco redditizio: rivedilo o toglilo.']}[P+Q];
  return{t:b[0]+(fast?' veloci':''),c:b[1],h:b[2]};
}

/* grafico: margine € in orizzontale, venduto in verticale, linee alle medie della categoria */
var QUAD={'++':['Fuoriclasse','--q1'],'+-':['Instancabili','--q2'],'-+':['Diamanti grezzi','--q3'],'--':['Rami secchi','--q4']};
/* valori "tondi" per gli assi */
function niceTicks(lo,hi,n){
  var span=hi-lo||1,step=Math.pow(10,Math.floor(Math.log10(span/n))),m=span/n/step;
  step*=m>=5?10:m>=2?5:m>=1?2:1;
  var out=[],v=Math.ceil(lo/step)*step;
  for(;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));
  return{ticks:out,step:step};
}
function fmtTick(v,step){var d=step<1?2:0;return v.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})}
/* grafico a quadranti disegnato a dimensione reale: i caratteri restano a 11-12 px su ogni schermo */
function drawQuadrant(gi,it,aJ,aG,aK){

  var full=el.clientWidth||520,side=full>=640,W=Math.max(280,Math.min(full-(side?206:0),720)),H=W<480?250:300,L=46,R=16,T=26,B=40,pw=W-L-R,ph=H-T-B;
  var mgs=it.map(function(x){return x.mg}),sds=it.map(function(x){return x.sold});
  var mn=Math.min.apply(null,mgs.concat([aG])),mx=Math.max.apply(null,mgs.concat([aG])),pad=Math.max((mx-mn)*0.12,0.25);
  var xt=niceTicks(mn-pad,mx+pad,W<480?3:5),x0=Math.min(mn-pad,xt.ticks[0]),x1=Math.max(mx+pad,xt.ticks[xt.ticks.length-1]);
  var yt=niceTicks(0,Math.max.apply(null,sds)*1.1,4),y1=Math.max(Math.max.apply(null,sds)*1.1,yt.ticks[yt.ticks.length-1]);
  var X=function(v){return L+(v-x0)/(x1-x0)*pw},Y=function(v){return T+ph-v/y1*ph};
  var ax=X(aG),ay=Y(aJ),h='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafico a quadranti: margine e venduto dei piatti">';

    +'<rect x="'+L+'" y="'+T+'" width="'+(ax-L)+'" height="'+(ay-T)+'" style="fill:var(--q2)" class="qbg"/>'
    +'<rect x="'+ax+'" y="'+ay+'" width="'+(L+pw-ax)+'" height="'+(T+ph-ay)+'" style="fill:var(--q3)" class="qbg"/>'
    +'<rect x="'+L+'" y="'+ay+'" width="'+(ax-L)+'" height="'+(T+ph-ay)+'" style="fill:var(--q4)" class="qbg"/>';

  xt.ticks.forEach(function(v){if(v<x0||v>x1)return;var x=X(v);h+='<line class="grid" x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+(T+ph)+'"/><text class="tk" x="'+x+'" y="'+(T+ph+16)+'" text-anchor="middle">'+fmtTick(v,xt.step)+' €</text>'});
  yt.ticks.forEach(function(v){var y=Y(v);h+='<line class="grid" x1="'+L+'" y1="'+y+'" x2="'+(L+pw)+'" y2="'+y+'"/><text class="tk" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmtTick(v,1)+'</text>'});
  h+='<line class="ax" x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'"/>';
  // medie
  h+='<line class="avgl" x1="'+ax+'" y1="'+T+'" x2="'+ax+'" y2="'+(T+ph)+'"/><line class="avgl" x1="'+L+'" y1="'+ay+'" x2="'+(L+pw)+'" y2="'+ay+'"/>'
    +'<text class="avt" x="'+(ax>L+pw*0.7?ax-6:ax+6)+'" y="'+(T+36)+'" text-anchor="'+(ax>L+pw*0.7?'end':'start')+'">media '+eur(aG)+'</text>'
    +'<text class="avt" x="'+(L+pw)+'" y="'+(ay-6)+'" text-anchor="end">media '+Math.round(aJ)+'</text>';
  // nomi dei quadranti, piccoli negli angoli
  var q=function(x,y,anc,c,t){return'<text class="ql" x="'+x+'" y="'+y+'" text-anchor="'+anc+'" style="fill:var('+c+')">'+t+'</text>'};
  h+=q(L+pw-8,T+16,'end','--q1','FUORICLASSE')+q(L+8,T+16,'start','--q2','INSTANCABILI')+q(L+pw-8,T+ph-8,'end','--q3','DIAMANTI GREZZI')+q(L+8,T+ph-8,'start','--q4','RAMI SECCHI');
  // titoli degli assi, orizzontali
  h+='<text class="at" x="'+(L+pw)+'" y="'+(H-4)+'" text-anchor="end">Margine per piatto (IVA escl.) →</text><text class="at" x="'+L+'" y="'+(T-8)+'" text-anchor="start">↑ Venduto (pezzi)</text>';
  var dots='',hits='',cnt={'++':0,'+-':0,'-+':0,'--':0};
  it.forEach(function(x,i){
    var k=(x.sold<aJ?'-':'+')+(x.mg<aG?'-':'+'),qq=QUAD[k];cnt[k]++;var fast=x.tm>0&&x.tm<aK,cx=X(x.mg).toFixed(1),cy=Y(x.sold).toFixed(1);
    var ex=x.r.inAvg===false;

  el.innerHTML='<div class="qwrap'+(side?' side':'')+'"><div class="qplot">'+h+dots+hits+'</svg></div><div class="qbox"><b class="qbt">Legenda</b>'
    +LG.map(function(l){return'<div class="qli"><i style="background:var('+l[1]+')"></i><div><span>'+l[2]+' <em>'+cnt[l[0]]+'</em></span><small>'+l[3]+'</small></div></div>'}).join('')
    +'<p class="qbn">Linee tratteggiate = medie della categoria. Passa sopra un punto per il nome del piatto.</p></div></div><div class="qtip"></div>';

/* barre orizzontali (una serie): rows [{label,value,text,color,tip,act,id,dim}] */
function hbars(rows,opt){

  var tgt=opt.target!=null?'<div class="hb-tgt" style="left:'+Math.min(100,opt.target/max*100)+'%"><span>'+esc(opt.targetLabel||'')+'</span></div>':'';

    var w=Math.max(0,Math.min(100,r.value/max*100));

      +'<div class="hb-t">'+tgt+'<div class="hb-b'+(r.dim?' dim':'')+'" style="width:'+w+'%;background:'+(r.color||'var(--bar)')+'"></div></div><div class="hb-v">'+esc(r.text)+'</div></div>';

/* dati aggregati sui piatti con prezzo e costo (venduto facoltativo) */
function dishes(){
  return S.recipes.map(function(r){var c=calcR(r);return{r:r,c:c,sold:num(r.sold)}}).filter(function(x){return x.c.net>0&&x.c.ok});
}
function aggregate(list){
  var withSold=list.filter(function(x){return x.sold>0}),useSold=withSold.length>0,L=useSold?withSold:list;
  var inc=0,fc=0,mg=0,sold=0,over=0,t=S.fcTarget/100;
  L.forEach(function(x){var w=useSold?x.sold:1;inc+=x.c.net*w;fc+=x.c.dose*w;mg+=(x.c.net-x.c.dose)*w;sold+=w});
  list.forEach(function(x){if(x.c.fcPct>t)over++});
  return{useSold:useSold,inc:inc,fc:fc,mg:mg,fcPct:inc>0?fc/inc:null,mgUnit:sold>0?mg/sold:null,over:over,n:list.length,sold:useSold?sold:0};
}

/* =====================================================================
   VENDITE (storico mensile) e periodo di analisi
   ===================================================================== */
var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function mLabel(m){var p=m.split('-');return MESI[+p[1]-1]+' '+p[0]}
function mAdd(m,n){var p=m.split('-'),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function thisMonth(){return new Date().toISOString().slice(0,7)}
/* settimane ISO "AAAA-Wnn": lunedì–domenica, la settimana 1 è quella con il primo giovedì dell'anno */
function isWk(k){return k.charAt(5)==='W'}
function isoWeeksIn(y){var p=function(x){return(x+Math.floor(x/4)-Math.floor(x/100)+Math.floor(x/400))%7};return p(y)===4||p(y-1)===3?53:52}
function wkKey(y,w){return y+'-W'+String(w).padStart(2,'0')}
function wkMon(k){var y=+k.slice(0,4),w=+k.slice(6),j4=Date.UTC(y,0,4),dw=(new Date(j4).getUTCDay()+6)%7;return new Date(j4-dw*864e5+(w-1)*6048e5)}
function wkOfUTC(ms){var t=new Date(ms),dw=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dw+3);var y=t.getUTCFullYear();return wkKey(y,1+Math.floor((t-Date.UTC(y,0,1))/6048e5))}
function wkAdd(k,n){return wkOfUTC(wkMon(k).getTime()+n*6048e5)}
function thisWeek(){var d=new Date();return wkOfUTC(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))}
/* la settimana conta nel mese del suo giovedì = il mese che contiene la maggior parte dei suoi giorni */
function wkMonth(k){return new Date(wkMon(k).getTime()+3*864e5).toISOString().slice(0,7)}
function wkDates(k){
  var a=wkMon(k),b=new Date(a.getTime()+6*864e5),f=function(d,y){return d.getUTCDate()+' '+MBR[d.getUTCMonth()]+(y?' '+d.getUTCFullYear():'')};
  return f(a,a.getUTCFullYear()!==b.getUTCFullYear())+' – '+f(b,true);
}
function wkLabel(k){return'settimana '+(+k.slice(6))+' · '+wkDates(k)}
/* vendite per mese: quelle mensili + le settimane attribuite al mese */
function buildMSales(){
  var o={};Object.keys(S.sales||{}).forEach(function(id){var s=S.sales[id],t=o[id]={};Object.keys(s).forEach(function(k){var m=isWk(k)?wkMonth(k):k;t[m]=(t[m]||0)+s[k]})});S.msales=o;
}
function salesMonths(){var set={},M=S.msales||{};Object.keys(M).forEach(function(id){Object.keys(M[id]).forEach(function(m){if(M[id][m]>0)set[m]=1})});return Object.keys(set).sort()}
function salesWeeks(){var set={};Object.keys(S.sales||{}).forEach(function(id){Object.keys(S.sales[id]).forEach(function(k){if(isWk(k)&&S.sales[id][k]>0)set[k]=1})});return Object.keys(set).sort()}
/* periodo scelto per l'analisi (Menù Ingegnerizzato e Riepilogo) */
function periodRange(){
  var P=route.per||(route.per={mode:'all'}),ms=salesMonths(),last=ms.length?ms[ms.length-1]:thisMonth(),from,to,label;
  if(P.mode==='3m'){to=last;from=mAdd(last,-2);label='ultimi 3 mesi ('+mLabel(from)+' – '+mLabel(to)+')'}
  else if(P.mode==='year'){var y=last.slice(0,4);from=y+'-01';to=y+'-12';label='anno '+y}
  else if(P.mode==='last'){from=to=last;label=mLabel(last)}
  else if(P.mode==='custom'){from=P.from||last;to=P.to||last;if(from>to){var t=from;from=to;to=t}label=from===to?mLabel(from):mLabel(from)+' – '+mLabel(to)}
  else{from=ms[0]||last;to=last;label='totale di tutte le vendite'+(ms.length>1?' ('+mLabel(from)+' – '+mLabel(to)+')':ms.length?' ('+mLabel(from)+')':'')}
  return{from:from,to:to,label:label,last:last};
}
/* il "venduto" di ogni piatto = somma delle vendite nel periodo scelto */
function applySales(){
  if(!S)return;buildMSales();var R=periodRange();
  S.recipes.forEach(function(r){var s=S.msales[r.id]||{},t=0;Object.keys(s).forEach(function(m){if(m>=R.from&&m<=R.to)t+=s[m]});r.sold=t||''});
}
function setPer(k,v){route.per=route.per||{mode:'all'};route.per[k]=v;if(k==='mode'&&v==='custom'){var R=periodRange();route.per.from=route.per.from||R.last;route.per.to=route.per.to||R.last}applySales();render()}

  var P=route.per||{mode:'all'},R=periodRange(),ms=salesMonths();
  var tot=S.recipes.reduce(function(s,r){return s+num(r.sold)},0);

  return'<div class="perbar"><b>Periodo vendite</b><select data-keep onchange="setPer(\'mode\',this.value)">'
    +o('all','Totale di tutte le vendite')+o('last','Ultimo mese con vendite')+o('3m','Ultimi 3 mesi')+o('year','Anno intero')+o('custom','Scegli i mesi…')+'</select>'
    +(P.mode==='custom'?'<label>da<input data-keep type="month" value="'+esc(R.from)+'" onchange="setPer(\'from\',this.value)"></label><label>a<input data-keep type="month" value="'+esc(R.to)+'" onchange="setPer(\'to\',this.value)"></label>':'')
    +'<span class="mut">'+esc(R.label)+' · '+tot.toLocaleString('it-IT')+' piatti venduti'+(ms.length?'':' · nessuna vendita inserita')+'</span>'

/* pagina Vendite: inserimento per mese o per settimana (scelta del cliente) */
var SPEND={};
function salesMonthSel(){if(!route.sm){var ms=salesMonths();route.sm=ms.length?ms[ms.length-1]:thisMonth()}return route.sm}
function salesWeekSel(){if(!route.sw){var ws=salesWeeks();route.sw=ws.length?ws[ws.length-1]:wkAdd(thisWeek(),-1)}return route.sw}
function curSalesKey(){return S.salesGrain==='W'?salesWeekSel():salesMonthSel()}

  w=Math.min(Math.max(1,w||1),isoWeeksIn(y));flushSales();route.sw=wkKey(y,w);render();

function venditeHTML(){
  if(!S.recipes.length)return'<div class="empty">Nessuna ricetta.<br>Creale nella sezione Ricette.</div>';
  var W=S.salesGrain==='W',k=curSalesKey();
  var h='<div class="sbar">'
    +(!S.isSuper?'':'<select class="csel" aria-label="Modo di inserimento" onchange="setGrain(this.value)"><option value="M"'+(W?'':' selected')+'>Inserimento per mese</option><option value="W"'+(W?' selected':'')+'>Inserimento per settimana</option></select>')
    +'<button class="sm" data-act="smprev" aria-label="'+(W?'Settimana':'Mese')+' precedente">‹</button>'
    +(W?'<label class="mut" for="swn">Settimana</label><input data-keep id="swn" class="swn" type="number" min="1" max="53" step="1" value="'+(+k.slice(6))+'" onchange="goWeek()"><input data-keep id="swy" class="swy" type="number" min="2000" max="2100" step="1" value="'+k.slice(0,4)+'" onchange="goWeek()" aria-label="Anno">'
      :'<input data-keep type="month" value="'+k+'" onchange="route.sm=this.value||thisMonth();render()">')
    +'<button class="sm" data-act="smnext" aria-label="'+(W?'Settimana':'Mese')+' successiv'+(W?'a':'o')+'">›</button>'
    +'<b class="smt'+(W?' wk':'')+'">'+(W?wkDates(k):mLabel(k))+'</b><span id="svstat" class="mut"></span>'
    +(S.isSuper?'<button class="sm'+(RO?' sres':'')+'" data-act="impopen" style="margin-left:auto">Importa da cassa (CSV)</button><input type="file" id="cassaf" accept=".csv,text/csv,text/plain" hidden onchange="cassaFile(this)">':'')

var CSTOP={e:1,di:1,al:1,alla:1,allo:1,ai:1,con:1,la:1,il:1,gr:1,g:1,kg:1};
function cnorm(x){return String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9. ]+/g,' ').trim()}

  for(i=1;i<=m;i++)for(j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}

  var best=function(x,L,f){return Math.max.apply(null,L.map(function(y){return f(x,y)}))};

function parseCsv(txt,sep){

function cassaParse(txt,fname){

  for(var i=0;i<Math.min(rows.length,30)&&h<0;i++){

    if(ni>=0&&qi>=0){h=i;col={n:ni,q:qi,g:low.indexOf('gruppo'),r:low.indexOf('reparto')}}
  }
  if(h<0)throw new Error('Nel file non trovo le colonne "Plu" e "Qta". È l’export delle vendite della cassa?');

    by[key].qty+=q;

  var all=[],p=ps[0],step=T.g==='w'?wkAdd:mAdd;while(p<=ps[ps.length-1]){all.push(p);p=step(p,1)}

  var a=t.dataset.act,id=t.dataset.id;
  /* clic sullo sfondo scuro di una scheda: chiude solo se non si è cliccato dentro la scheda */
  if(a==='closebg'){if(e.target!==t)return;if(route.pw){if(!route.pw.forced)route.pw=null}else{route.food=null;route.bulk=null;route.sreset=null;route.imp=null}render();return}
  /* accesso e account */
  if(a==='goregister'){route.auth='register';route.authMsg='';renderAuth();return}
  if(a==='gologin'){route.auth='login';route.authMsg='';renderAuth();return}
  if(a==='logout'){api('POST','/logout',{}).catch(function(){}).then(function(){ME=null;S=null;CUR=null;ADM=null;route.pw=null;route.auth='login';route.authMsg='';render()});return}
  if(a==='pwopen'){route.pw={forced:false};render();return}
  if(a==='pwclose'){if(route.pw&&!route.pw.forced){route.pw=null;render()}return}
  /* pannello clienti */
  if(a==='tapprove'){busy(t,api('PUT','/admin/tenants/'+id,{status:'approved'})).then(function(){ADM.msg='';return admReload()}).catch(showErr);return}
  if(a==='tstatus'){ADM.open=id;busy(t,api('PUT','/admin/tenants/'+id,{status:t.dataset.s})).then(admReload).catch(showErr);return}
  if(a==='tsave'){
    ADM.open=id;var mx=val('mx-'+id);
    busy(t,api('PUT','/admin/tenants/'+id,{ragione:val('rg-'+id),tipo:val('tp-'+id),plan:val('pl-'+id),maxRecipes:mx===''?null:mx,
      canAddFoods:document.getElementById('cf-'+id).checked,canAddRecipes:document.getElementById('cr-'+id).checked,salesGrain:val('sgr-'+id)}))
      .then(function(){toast('Cliente aggiornato.');return admReload()}).then(function(){if(CUR===id)return reload()}).catch(showErr);return}
  if(a==='tdelete'){if(armed(t,'Tocca ancora: elimina tutti i suoi dati'))busy(t,api('DELETE','/admin/tenants/'+id,{})).then(function(){if(CUR===id){CUR=null;S=null;lsSet('fc:tenant',null)}return admReload()}).catch(showErr);return}
  if(a==='twork'){switchTenant(id);return}
  if(a==='tcreate'){
    var em=val('nc-email').trim();
    busy(t,api('POST','/admin/tenants',{ragione:val('nc-rag'),tipo:val('nc-tipo'),email:em,demo:document.getElementById('nc-demo').checked})).then(function(d){
      ADM.msg=d.tempPassword?'':'<div class="info">Cliente creato.</div>';if(d.tempPassword)tmpMsg(em,d.tempPassword);ADM.open=d.id;window.scrollTo(0,0);return admReload();
    }).catch(showErr);return}
  if(a==='ureset'){if(armed(t,'Tocca ancora per generarla'))busy(t,api('POST','/admin/users/'+id+'/reset',{})).then(function(d){tmpMsg(t.dataset.email,d.tempPassword);window.scrollTo(0,0);return admReload()}).catch(showErr);return}
  if(a==='ustatus'){busy(t,api('PUT','/admin/users/'+id,{status:t.dataset.s})).then(admReload).catch(showErr);return}
  if(a==='vsave'||a==='vcreate'){
    var pre=a==='vsave'?'vt-'+id+'-':'nv-t-',tids=ADM.tenants.filter(function(x){var c=document.getElementById(pre+x.id);return c&&c.checked}).map(function(x){return x.id});
    if(a==='vsave')busy(t,api('PUT','/admin/users/'+id,{tenantIds:tids})).then(function(){toast('Visualizzatore aggiornato.');return admReload()}).catch(showErr);
    else{var ve=val('nv-email').trim();busy(t,api('POST','/admin/viewers',{email:ve,tenantIds:tids})).then(function(d){tmpMsg(ve,d.tempPassword);window.scrollTo(0,0);return admReload()}).catch(showErr)}
    return}
  if(a==='vdelete'){if(armed(t,'Tocca ancora per eliminare'))busy(t,api('DELETE','/admin/users/'+id,{})).then(admReload).catch(showErr);return}
  /* dati dell'attività */
  if(!S)return;
  if(a==='newfood'){var lf=lockFood();if(lf){showLock(lf);return}route.food={id:uid(),isNew:true,name:'',category:'',supplier:'',unit:'kg',mode:'max',packQty:'',packUnit:'g',history:[]};render()}
  else if(a==='smprev'||a==='smnext'){flushSales();var dn=a==='smprev'?-1:1;if(S.salesGrain==='W')route.sw=wkAdd(salesWeekSel(),dn);else route.sm=mAdd(salesMonthSel(),dn);render()}
  else if(a==='sreset'){if(RO)return;flushSales();route.sreset={scope:'one'};render()}
  else if(a==='sresetclose'){route.sreset=null;render()}
  else if(a==='impopen'){flushSales();var cf=document.getElementById('cassaf');if(cf)cf.click()}
  else if(a==='impclose'){route.imp=null;render()}
  else if(a==='impgo'){
    var I=route.imp;if(!I||!isWk(I.week))return;
    busy(t,api('POST','/sales/import',{period:I.week,rows:I.items.map(function(x){return{name:x.name,recipeId:x.rid||null,qty:x.qty}})})).then(function(d){
      route.imp=null;route.sw=I.week;return loadData().then(function(){render();toast('Importati '+num(d.qty).toLocaleString('it-IT')+' pezzi su '+d.recipes+' piatti nella '+wkLabel(I.week).split(' · ')[0]+'.')});
    }).catch(showErr)}
  else if(a==='sresetgo'){
    if(RO)return;var all=route.sreset.scope==='all',k=curSalesKey();clearTimeout(timers.sales);SPEND={};
    busy(t,api('POST','/sales/reset',all?{scope:'all'}:{period:k})).then(function(d){
      if(all)S.sales={};else Object.keys(S.sales||{}).forEach(function(id){delete S.sales[id][k]});
      route.sreset=null;applySales();render();toast(d.deleted?'Vendite azzerate.':'Non c’erano vendite da azzerare.');
    }).catch(showErr)}
  else if(a==='editfood'){route.food=clone(foodById(id));render()}
  else if(a==='ingfood'){var fi=foodById(id);if(!fi)return;route.food=clone(fi);render()}
  else if(a==='bulkmode'){if(RO)return;var vf=visibleFoods();if(!vf.length){toast('Nessun alimento in elenco.');return}
    route.bulk={mode:vf.every(function(f){return f.mode==='avg'})?'max':'avg'};render()}
  else if(a==='bulkpick'){route.bulk.mode=t.dataset.m;render()}
  else if(a==='bulkclose'){route.bulk=null;render()}
  else if(a==='bulkapply'){
    var pv=bulkPreview(route.bulk.mode),md=route.bulk.mode;
    busy(t,api('PATCH','/foods',{mode:md,ids:pv.changed.map(function(f){return f.id})})).then(function(d){
      route.bulk=null;return reload().then(function(){toast('Prezzo “'+MODES[md].toLowerCase()+'” applicato a '+d.updated+' alimenti.')});
    }).catch(function(x){var be=document.getElementById('berr');if(be)be.textContent=x.message;else showErr(x)});
  }
  else if(a==='closefood'){route.food=null;render()}
  else if(a==='addprice'){
    var p=num(document.getElementById('np-p').value),d=document.getElementById('np-d').value||today();
    if(p>0){route.food.history.push({id:uid(),date:d,price:p});refreshSheet()}
  }
  else if(a==='delprice'){route.food.history=route.food.history.filter(function(h){return h.id!==id});refreshSheet()}
  else if(a==='savefood'){
    var f=route.food,err=document.getElementById('ferr');
    if(!f.name.trim()){err.textContent='Inserisci la descrizione del prodotto.';return}
    var dup=S.foods.filter(function(x){return x.id!==f.id&&x.name.trim().toLowerCase()===f.name.trim().toLowerCase()})[0];
    if(dup){err.textContent='Esiste già un alimento con questo nome.';return}
    var fo={name:f.name.trim(),category:f.category,supplier:(f.supplier||'').trim(),unit:f.unit,mode:f.mode,packQty:f.packQty,packUnit:f.packUnit,history:f.history.map(function(h){return{date:h.date,price:h.price}})};
    busy(t,f.isNew?api('POST','/foods',fo):api('PUT','/foods/'+f.id,fo)).then(function(){route.food=null;return reload()}).catch(function(x){err.textContent=x.message});
  }
  else if(a==='delfood'){if(armed(t,'Tocca ancora per eliminare'))busy(t,api('DELETE','/foods/'+route.food.id,{})).then(function(){route.food=null;return reload()}).catch(showErr)}
  else if(a==='newrecipe'){var lr=lockRecipe();if(lr){showLock(lr);return}route.recipe={id:uid(),isNew:true,name:'',type:'',portions:1,yieldG:'',price:'',rows:[{foodId:'',subId:'',name:'',qty:'',waste:''}]};render();window.scrollTo(0,0)}
  else if(a==='editrecipe'){route.recipe=clone(recipeById(id));render();window.scrollTo(0,0)}
  else if(a==='backrecipe'){closeRecipe();render()}
  else if(a==='openrecipe'){var rr=recipeById(id);if(!rr)return;if(route.tab==='vendite')flushSales();route.from=route.tab;route.fromY=window.scrollY;route.tab='ricette';route.q='';route.cat='';route.recipe=clone(rr);render();window.scrollTo(0,0)}
  else if(a==='addrow'){route.recipe.rows.push({foodId:'',subId:'',name:'',qty:'',waste:''});render();
    var inp=document.querySelectorAll('.ing .top input');if(inp.length)inp[inp.length-1].focus()}
  else if(a==='delrow'){route.recipe.rows.splice(+t.dataset.i,1);render()}
  else if(a==='saverecipe'||a==='dupl'){
    var r=route.recipe,err2=document.getElementById('rerr');
    if(!r.name.trim()){err2.textContent='Inserisci il nome del piatto.';return}
    var ro=recipeOut(r),req;
    if(a==='dupl'){var ld=lockRecipe();if(ld){err2.textContent=ld;return}ro.name=ro.name+' (copia)';req=api('POST','/recipes',ro)}
    else req=r.isNew?api('POST','/recipes',ro):api('PUT','/recipes/'+r.id,ro);
    busy(t,req).then(function(){closeRecipe();return reload()}).catch(function(x){err2.textContent=x.message});
  }
  else if(a==='delrecipe'){if(armed(t,'Tocca ancora per eliminare'))busy(t,api('DELETE','/recipes/'+route.recipe.id,{})).then(function(){closeRecipe();return reload()}).catch(showErr)}
  else if(a==='addlist'){var k=t.dataset.k,v=val('add-'+k).trim();if(v&&S.lists[k].indexOf(v)<0)busy(t,api('POST','/lists',{kind:k,value:v})).then(reload).catch(showErr)}
  else if(a==='dellist'){busy(t,api('DELETE','/lists',{kind:t.dataset.k,value:S.lists[t.dataset.k][+t.dataset.i]})).then(reload).catch(showErr)}
  /* solo super admin (il server rifiuta comunque chiunque altro) */
  else if(a==='addtipo'){var tv=val('add-tipiAttivita').trim();if(tv)busy(t,api('POST','/admin/lists',{value:tv})).then(reload).catch(showErr)}
  else if(a==='deltipo'){busy(t,api('DELETE','/admin/lists',{value:S.lists.tipiAttivita[+t.dataset.i]})).then(reload).catch(showErr)}
  else if(a==='export'){busy(t,api('GET','/admin/export?tenant='+CUR)).then(function(d){download('foodcost-'+slug(S.tenant.ragione)+'-'+today()+'.json',d)}).catch(showErr)}
  else if(a==='exportall'){busy(t,api('GET','/admin/export')).then(function(d){download('foodcost-tutti-i-clienti-'+today()+'.json',d)}).catch(showErr)}
  else if(a==='import'){
    var o;try{o=JSON.parse(val('bk'));if(!o.foods||!o.recipes)throw 0}catch(x){msg('Backup non valido.');return}
    if(armed(t,'Tocca ancora: sostituisce i dati di '+S.tenant.ragione))busy(t,api('POST','/admin/import',{tenant:CUR,data:o})).then(reload).then(function(){toast('Dati importati.')}).catch(function(x){msg(x.message)});
  }
  else if(a==='reseed'){if(armed(t,'Tocca ancora per sostituire tutto'))busy(t,api('POST','/admin/seed',{tenant:CUR})).then(reload).then(function(){toast('Dati di test caricati.')}).catch(showErr)}
});
function closeRecipe(){
  route.recipe=null;
  if(route.from){route.tab=route.from;route.from=null;route.restoreY=route.fromY||0}
}
function msg(m){var e=document.getElementById('bkmsg');if(e)e.textContent=m}
boot();
</script>
</body>
</html>
